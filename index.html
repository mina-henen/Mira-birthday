<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <audio id="birthdayMusic" loop>
  <source src="kol-sana-wenta-tayb.mp3" type="audio/mpeg">
</audio>
<title>Happy Birthday Maramiroo 🩷</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap');
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; min-height: 100vh; overflow-x: hidden; }
  body {
    background: linear-gradient(160deg, #ff6fb7 0%, #ff9ed8 35%, #ffb3e6 65%, #ffd6f7 100%);
    font-family: 'Poppins', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 1rem; position: relative; overflow: hidden;
  }
  .particle { position: fixed; bottom: -60px; pointer-events: none; animation: floatUp var(--dur) linear infinite var(--delay); font-size: var(--sz); z-index: 1; }
  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 1; }
    50% { transform: translateY(-50vh) translateX(var(--drift)) rotate(180deg); opacity: 0.85; }
    100% { transform: translateY(-110vh) translateX(calc(var(--drift)*1.5)) rotate(360deg); opacity: 0; }
  }
  .conf { position: fixed; top: -16px; width: var(--cw); height: calc(var(--cw) * 0.45); background: var(--cc); border-radius: 2px; animation: confFall var(--cdur) linear var(--cdelay) infinite; opacity: 0.88; z-index: 1; }
  @keyframes confFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) translateX(var(--cxd)) rotate(700deg); opacity: 0.2; }
  }
  .star { position: fixed; pointer-events: none; animation: twinkle var(--d) ease-in-out var(--sd) infinite; opacity: 0; z-index: 1; font-size: var(--fsz); color: var(--sc); }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1.3); } }
  .balloon-wrap { position: fixed; bottom: 0; animation: bFloat var(--bdur) ease-in-out infinite alternate; z-index: 2; pointer-events: none; }
  @keyframes bFloat { from { transform: rotate(-5deg) translateY(0); } to { transform: rotate(5deg) translateY(-20px); } }
  .balloon { border-radius: 50% 50% 50% 50% / 42% 42% 58% 58%; position: relative; }
  .balloon::before { content: ''; position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%); width: 7px; height: 7px; background: inherit; border-radius: 50%; }
  .balloon-string { width: 2px; margin: 0 auto; background: rgba(0,0,0,0.18); border-radius: 0 0 2px 2px; }

  /* Main card */
  .card {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1.5px solid rgba(255,255,255,0.45);
    border-radius: 28px;
    padding: clamp(1.5rem, 5vw, 2.5rem) clamp(1.2rem, 6vw, 3rem);
    text-align: center;
    width: min(92vw, 520px);
    box-shadow: 0 8px 40px rgba(255,80,180,0.22), inset 0 1px 0 rgba(255,255,255,0.5);
    animation: cardIn 1.1s cubic-bezier(0.34,1.56,0.64,1) forwards;
    opacity: 0;
    position: relative;
    z-index: 10;
  }
  @keyframes cardIn { from { opacity: 0; transform: scale(0.6) translateY(50px); } to { opacity: 1; transform: scale(1) translateY(0); } }

  /* Photo frame */
  .photo-frame {
    position: relative;
    width: clamp(140px, 45vw, 180px);
    height: clamp(140px, 45vw, 180px);
    margin: 0 auto 1.2rem;
    animation: fadeUp 0.8s 0.3s both;
  }
  .photo-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff4fa3, #ffb3e6, #ff4fa3, #ffcce9);
    background-size: 200% 200%;
    animation: gradientSpin 3s linear infinite;
    z-index: 0;
  }
  @keyframes gradientSpin { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  .photo-sparkle-ring {
    position: absolute;
    inset: -22px;
    border-radius: 50%;
    animation: spinCrown 9s linear infinite;
    pointer-events: none;
    z-index: 2;
  }
  @keyframes spinCrown { to { transform: rotate(360deg); } }
  .photo-sparkle-ring span {
    position: absolute;
    top: 0; left: 50%;
    transform-origin: 0 calc(clamp(140px, 45vw, 180px)/2 + 22px);
    transform: rotate(var(--r));
    font-size: 12px;
    animation: cFlash 1.4s ease-in-out var(--sd) infinite;
  }
  @keyframes cFlash { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
  .photo-img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    object-position: center top;
    position: relative;
    z-index: 1;
    border: 3px solid #fff;
    box-shadow: 0 0 24px rgba(255,100,180,0.5);
  }
  .photo-badge {
    position: absolute;
    bottom: 0; right: 0;
    background: linear-gradient(135deg, #ff4fa3, #ff82c4);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 100px;
    border: 2px solid #fff;
    z-index: 3;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(255,80,160,0.4);
    animation: badgePop 0.6s 1s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes badgePop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Sparkle crown above card */
  .crown { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); width: 72px; height: 72px; animation: spinCrown2 9s linear infinite; pointer-events: none; }
  @keyframes spinCrown2 { to { transform: translateX(-50%) rotate(360deg); } }
  .crown span { position: absolute; top: 0; left: 50%; transform-origin: 0 36px; transform: rotate(var(--r)); font-size: 13px; animation: cFlash 1.4s ease-in-out var(--sd) infinite; }

  .happy { font-family: 'Dancing Script', cursive; font-size: clamp(1.8rem, 7vw, 3.2rem); color: #fff; text-shadow: 0 2px 18px rgba(255,80,160,0.55); line-height: 1.2; animation: glow 2.5s ease-in-out infinite; }
  @keyframes glow { 0%,100% { text-shadow: 0 2px 18px rgba(255,80,160,0.55); } 50% { text-shadow: 0 2px 30px rgba(255,80,160,1), 0 0 50px rgba(255,255,255,0.5); } }
  .name { font-family: 'Dancing Script', cursive; font-size: clamp(2.4rem, 10vw, 4.5rem); color: #ffe0f5; text-shadow: 0 0 28px rgba(255,160,220,0.8); animation: shimmer 3s ease-in-out infinite; display: block; line-height: 1.1; margin: 0.1rem 0 0.6rem; }
  @keyframes shimmer { 0%,100% { color: #ffe0f5; } 33% { color: #fff5fc; } 66% { color: #ffcce9; } }

  .candles { display: flex; justify-content: center; gap: clamp(0.6rem, 3vw, 1.2rem); margin: 0.8rem 0; animation: fadeUp 0.8s 1.1s both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .candle { display: flex; flex-direction: column; align-items: center; animation: wobble 1.6s ease-in-out infinite; }
  .candle:nth-child(2) { animation-delay: 0.3s; }
  .candle:nth-child(3) { animation-delay: 0.6s; }
  @keyframes wobble { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .flame { width: 14px; height: 20px; background: radial-gradient(ellipse at 50% 80%, #fff700 0%, #ffb300 40%, #ff5e00 100%); border-radius: 50% 50% 30% 30%; box-shadow: 0 0 10px 3px rgba(255,180,0,0.7); animation: fPulse 0.55s ease-in-out infinite alternate; }
  @keyframes fPulse { 0% { transform: scaleX(1); } 100% { transform: scaleX(0.78) scaleY(1.18); box-shadow: 0 0 18px 6px rgba(255,220,0,0.9); } }
  .wick { width: 2px; height: 5px; background: #555; }
  .stick { width: 9px; height: clamp(22px, 5vw, 30px); background: linear-gradient(to bottom, #ff6fb7, #cc2288); border-radius: 2px; }

  .wish { color: rgba(255,255,255,0.92); font-size: clamp(0.82rem, 3vw, 1.05rem); line-height: 1.85; animation: fadeUp 0.8s 1.3s both; }
  .emoji-row { font-size: clamp(1.1rem, 4vw, 1.5rem); margin-top: 0.8rem; letter-spacing: 4px; animation: fadeUp 0.8s 1.5s both; }
  .music-btn {
  margin-top: 1rem;
  padding: 10px 18px;
  border: none;
  border-radius: 999px;
  background: linear-gradient(135deg, #ff4fa3, #ff82c4);
  color: white;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(255, 80, 160, 0.4);
  transition: all 0.3s ease;
  animation: fadeUp 0.8s 1.7s both;
}

.music-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 6px 20px rgba(255, 80, 160, 0.6);
}

.music-btn:active {
  transform: scale(0.95);
}
</style>
</head>

<script>

const music = document.getElementById('birthdayMusic');

// Try autoplay immediately
music.play().catch(() => {});

// Toggle play/pause on any screen touch or click
const btn = document.getElementById("musicBtn");

btn.addEventListener("click", () => {
  if (music.paused) {
    music.play().catch(() => {});
    btn.innerText = "⏸ Pause 💕";
  } else {
    music.pause();
    btn.innerText = "🎵 Play for you 💖";
  }
});
  
  // Crown sparkles
  const crown = document.getElementById('crown');
  ['✨','⭐','💫','🌟','✨','💫','⭐','🌟'].forEach((e,i) => {
    const s = document.createElement('span');
    s.textContent = e;
    s.style.setProperty('--r', (i*45)+'deg');
    s.style.setProperty('--sd', (i*0.18)+'s');
    crown.appendChild(s);
  });

  // Photo sparkle ring
  const ps = document.getElementById('photoSparkle');
  ['✨','💖','🌟','💕','✨','🌟','💖','💕'].forEach((e,i) => {
    const s = document.createElement('span');
    s.textContent = e;
    s.style.setProperty('--r', (i*45)+'deg');
    s.style.setProperty('--sd', (i*0.2)+'s');
    ps.appendChild(s);
  });

  const isMobile = window.innerWidth < 600;
  const emojis = ['❤️','💖','💕','🌸','✨','💫','🦋','🌺','💗','🎀','💝','🌷'];
  const pCont = document.getElementById('particles');
  for (let i = 0; i < (isMobile ? 14 : 26); i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[i % emojis.length];
    p.style.left = (Math.random()*100)+'vw';
    p.style.setProperty('--dur', (6+Math.random()*8)+'s');
    p.style.setProperty('--delay','0s');
    p.style.animationDelay = (Math.random()*8)+'s';
    p.style.setProperty('--sz', (12+Math.random()*14)+'px');
    p.style.setProperty('--drift', (Math.random()*70-35)+'px');
    pCont.appendChild(p);
  }

  const cColors = ['#ff6fb7','#ffb3e6','#ffd6a5','#a8edff','#b5ffe1','#fff59d','#d4a8ff','#ff9ee0'];
  const cCont = document.getElementById('confetti');
  for (let i = 0; i < (isMobile ? 28 : 50); i++) {
    const c = document.createElement('div');
    c.className = 'conf';
    c.style.left = (Math.random()*100)+'vw';
    c.style.setProperty('--cw', (6+Math.random()*9)+'px');
    c.style.setProperty('--cc', cColors[i%cColors.length]);
    c.style.setProperty('--cdur', (4+Math.random()*6)+'s');
    c.style.setProperty('--cdelay', (Math.random()*6)+'s');
    c.style.setProperty('--cxd', (Math.random()*90-45)+'px');
    cCont.appendChild(c);
  }

  const sCont = document.getElementById('stars');
  const sColors = ['#fff','#ffd6f7','#ffe0a0','#c8f0ff'];
  for (let i = 0; i < (isMobile ? 14 : 22); i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.textContent = '✦';
    s.style.left = (Math.random()*100)+'vw';
    s.style.top = (Math.random()*100)+'vh';
    s.style.setProperty('--fsz', (8+Math.random()*12)+'px');
    s.style.setProperty('--sc', sColors[Math.floor(Math.random()*4)]);
    s.style.setProperty('--d', (1.5+Math.random()*3)+'s');
    s.style.setProperty('--sd', (Math.random()*3)+'s');
    sCont.appendChild(s);
  }

  const bColors = [
    'radial-gradient(circle at 35% 30%, #ff9ee0, #ff4fa3)',
    'radial-gradient(circle at 35% 30%, #ffb3f5, #d94fda)',
    'radial-gradient(circle at 35% 30%, #ffd6a5, #ff8c42)',
    'radial-gradient(circle at 35% 30%, #a8edff, #4fc3f7)',
  ];
  const bPos = isMobile ? [2, 15, 72, 85] : [3, 12, 22, 68, 78, 88];
  const bSize = isMobile ? 36 : 50;
  const bCont = document.getElementById('balloons');
  bPos.forEach((pos, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'balloon-wrap';
    wrap.style.left = pos+'vw';
    wrap.style.setProperty('--bdur', (3+Math.random()*3)+'s');
    wrap.style.animationDelay = (i*0.4)+'s';
    const b = document.createElement('div');
    b.className = 'balloon';
    const sz = (bSize + Math.random()*20);
    b.style.width = sz+'px';
    b.style.height = (sz*1.25)+'px';
    b.style.background = bColors[i % bColors.length];
    b.style.filter = 'drop-shadow(0 3px 6px rgba(0,0,0,0.18))';
    const str = document.createElement('div');
    str.className = 'balloon-string';
    str.style.height = (isMobile ? 28 : 38)+'px';
    wrap.appendChild(b);
    wrap.appendChild(str);
    bCont.appendChild(wrap);
  });
</script>
</body>
</html>
